<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>사용자 등록신청 · 일일 업무일지</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="screen-settings.css"></head><body>
<section class="login-section"><div class="login-card"><div class="login-title"><span class="login-icon" aria-hidden="true" data-icon="users"></span><h1>사용자 등록신청</h1><p>관리자가 승인한 후 로그인할 수 있습니다.</p></div>
<form id="register-form"><div class="form-field"><label for="register-username">아이디</label><input id="register-username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" minlength="2" maxlength="40" required><small>2~40자의 한글·영문·숫자·점·밑줄·하이픈</small></div><div class="form-field"><label for="register-password">비밀번호</label><input id="register-password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required><small>8자 이상 입력하세요.</small></div><div class="form-field"><label for="register-confirmation">비밀번호 확인</label><input id="register-confirmation" name="passwordConfirmation" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></div><button type="submit" class="primary-btn login-btn">등록신청</button></form>
<p id="register-message" class="registration-message" role="status" aria-live="polite"></p><a href="/" class="register-link">로그인 화면으로</a></div></section>
<div id="register-loading" class="loading-overlay" hidden><div class="loading-panel" role="status" aria-live="polite"><div class="orbit-spinner" aria-hidden="true"><span style="--dot:0"></span><span style="--dot:1"></span><span style="--dot:2"></span><span style="--dot:3"></span><span style="--dot:4"></span><span style="--dot:5"></span><span style="--dot:6"></span><span style="--dot:7"></span></div><p>등록신청을 처리하고 있습니다…</p></div></div>
<script src="icons.js"></script>
<script src="screen-settings.js"></script><script src="register.js"></script></body></html>
