<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>비밀번호 변경 · 일일 업무일지</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="screen-settings.css"><link rel="stylesheet" href="app-shell.css"><link rel="stylesheet" href="ui-shell.css"><style>.password-change-card{position:relative}.password-change-close{position:absolute;top:12px;right:12px;width:44px;height:44px}.password-change-card .login-title{padding-top:24px}</style></head><body>
<section class="login-section"><div class="login-card password-change-card"><button id="password-change-close" class="shell-icon password-change-close" type="button" title="닫기" aria-label="비밀번호 변경 닫기" data-icon="close" disabled></button><div class="login-title"><span class="login-icon" aria-hidden="true" data-icon="password"></span><h1>비밀번호 변경</h1><p id="password-change-description">본인만 아는 새 비밀번호로 변경해 주세요.</p></div>
<form id="change-password-form"><div class="form-field"><label for="current-password">현재 또는 임시 비밀번호</label><input id="current-password" name="currentPassword" type="password" autocomplete="current-password" required></div><div class="form-field"><label for="register-password">새 비밀번호</label><input id="register-password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required><small>8자 이상 입력하세요.</small></div><div class="form-field"><label for="register-confirmation">비밀번호 확인</label><input id="register-confirmation" name="passwordConfirmation" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></div><button type="submit" class="primary-btn login-btn">비밀번호 변경</button></form>
<p id="change-password-message" class="registration-message" role="status" aria-live="polite"></p><button id="password-change-logout" class="secondary-btn register-link" type="button">로그아웃</button></div></section>
<div id="password-change-loading" class="loading-overlay" hidden><div class="loading-panel" role="status" aria-live="polite"><div class="orbit-spinner" aria-hidden="true"><span style="--dot:0"></span><span style="--dot:1"></span><span style="--dot:2"></span><span style="--dot:3"></span><span style="--dot:4"></span><span style="--dot:5"></span><span style="--dot:6"></span><span style="--dot:7"></span></div><p>비밀번호를 변경하고 있습니다…</p></div></div>
<script src="icons.js"></script>
<script src="screen-settings.js"></script><script src="change-password.js"></script></body></html>
