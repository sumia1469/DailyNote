<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>플랫 아이콘 시안 · Daily Note</title><style>body{margin:0;padding:20px;background:#171a1f;color:#e4e7eb;font:16px system-ui,sans-serif}main{max-width:880px;margin:auto}img{display:block;width:100%;height:auto}p{line-height:1.7;color:#a4adb7}a{color:#a7c6b6}</style><main><h1>플랫 아이콘 시안</h1><p>입체 이모지를 단순한 SVG 아이콘으로 바꾸는 시안입니다. 아직 실제 화면의 아이콘은 변경하지 않았습니다.</p><img src="images/icon-preview.svg" alt="다크와 라이트 모드 아이콘 시안: 업무일지, 알림, 파일, 새 일지, 수정, 복제, 사용자, 권한, 화면 설정, 업로드, 비밀번호, 로그아웃"><p>위에서부터 업무일지 · 알림 · 파일 · 새 일지 / 수정 · 복제 · 사용자 · 권한 / 화면 설정 · 업로드 · 비밀번호 · 로그아웃 순서입니다.</p><p>아이콘 옆에는 한글 버튼 이름을 함께 표시합니다. 모바일에서는 20~24px 아이콘과 44px 이상의 터치 영역을 사용합니다.</p><a href="/">업무일지로 돌아가기</a></main></html>
