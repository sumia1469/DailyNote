name: Build portable Windows package
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build-portable.py
      - uses: actions/upload-artifact@v4
        with:
          name: DailyNote-Windows-x64
          path: dist/DailyNote-Windows-x64.zip
          retention-days: 30

