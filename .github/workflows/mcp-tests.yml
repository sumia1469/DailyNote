name: Verify DailyNote MCP
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/mcp.js'
      - 'src/server.js'
      - 'test/mcp.test.js'
      - '.github/workflows/mcp-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test
      - run: npm run test:ui
      - run: node --check src/mcp.js
